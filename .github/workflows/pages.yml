name: Deploy app
on:
  push:
    branches: [codex/initial-foundation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: become-better-pages
  cancel-in-progress: false
jobs:
  build:
    if: vars.DEPLOY_GITHUB_PAGES == 'true'
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_BASE_PATH: /become-better-next/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check independent cloud configuration
        run: |
          node --input-type=module <<'JS'
          const url = process.env.VITE_SUPABASE_URL?.trim();
          const key = process.env.VITE_SUPABASE_PUBLISHABLE_KEY?.trim();
          if (!url && !key) {
            console.log('Publishing the clearly labeled demo; sign-in and cloud sync remain unavailable.');
          } else {
            if (!url || !key) throw new Error('Set both new cloud variables together');
            const parsed = new URL(url);
            if (parsed.protocol !== 'https:' || parsed.hostname.includes('csjhpmqagaltnaicgryp')) throw new Error('Use only the new independent Supabase project');
            if (key.startsWith('sb_secret_')) throw new Error('Secret keys must never enter the frontend');
            if (!key.startsWith('sb_publishable_')) {
              const payload = JSON.parse(Buffer.from(key.split('.')[1] || '', 'base64url').toString());
              if (payload.role !== 'anon') throw new Error('Use a public publishable or anon key only');
            }
          }
          JS
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy new app
        id: deployment
        uses: actions/deploy-pages@v4
